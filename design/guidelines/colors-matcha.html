<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-secondary)}.n{font:500 13px/1.2 var(--font-sans)}</style></head><body><div style="display:grid;grid-template-columns:repeat(11,1fr);gap:6px"><div><div style="height:72px;border-radius:8px;background:var(--matcha-50);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">50</div><div class="m" id="matcha-50"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-100);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">100</div><div class="m" id="matcha-100"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-200);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">200</div><div class="m" id="matcha-200"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-300);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">300</div><div class="m" id="matcha-300"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-400);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">400</div><div class="m" id="matcha-400"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-500);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">500</div><div class="m" id="matcha-500"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-600);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">600</div><div class="m" id="matcha-600"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-700);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">700</div><div class="m" id="matcha-700"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-800);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">800</div><div class="m" id="matcha-800"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-900);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">900</div><div class="m" id="matcha-900"></div></div><div><div style="height:72px;border-radius:8px;background:var(--matcha-950);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">950</div><div class="m" id="matcha-950"></div></div></div><script>document.querySelectorAll('.m[id]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.id).trim()})</script></body></html>
