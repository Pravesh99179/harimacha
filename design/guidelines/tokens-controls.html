<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-secondary)}.n{font:500 13px/1.2 var(--font-sans)}</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px"><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="checkbox-size" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--checkbox-size</span><span class="m" data-v="checkbox-size"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="checkbox-radius" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--checkbox-radius</span><span class="m" data-v="checkbox-radius"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="checkbox-border" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--checkbox-border</span><span class="m" data-v="checkbox-border"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="checkbox-border-hover" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--checkbox-border-hover</span><span class="m" data-v="checkbox-border-hover"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="checkbox-bg-checked" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--checkbox-bg-checked</span><span class="m" data-v="checkbox-bg-checked"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="checkbox-mark" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--checkbox-mark</span><span class="m" data-v="checkbox-mark"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="radio-dot-size" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--radio-dot-size</span><span class="m" data-v="radio-dot-size"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="switch-track-w" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--switch-track-w</span><span class="m" data-v="switch-track-w"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="switch-track-off" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--switch-track-off</span><span class="m" data-v="switch-track-off"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="switch-track-on" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--switch-track-on</span><span class="m" data-v="switch-track-on"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="switch-thumb-bg" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--switch-thumb-bg</span><span class="m" data-v="switch-thumb-bg"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="switch-thumb-on" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--switch-thumb-on</span><span class="m" data-v="switch-thumb-on"></span></div></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=cs.getPropertyValue('--'+e.dataset.v).trim().replace(/^var\(--(.*)\)$/,'→ $1')});document.querySelectorAll('.sw').forEach(e=>{const v=cs.getPropertyValue('--'+e.dataset.t).trim();e.style.background='var(--'+e.dataset.t+')';if(!/(#|rgb|var\(--(matcha|cream|haldi|neutral|mirchi|neel|surface|border|text))/.test(v))e.style.visibility='hidden'})</script></body></html>
