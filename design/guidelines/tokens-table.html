x:1">--badge-radius</span><span class="m" data-v="badge-radius"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="card-bg" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--card-bg</span><span class="m" data-v="card-bg"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="card-radius" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--card-radius</span><span class="m" data-v="card-radius"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="card-border" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--card-border</span><span class="m" data-v="card-border"></span></div><div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-subtle)"><span class="sw" data-t="card-padding" style="width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)"></span><span class="n" style="font-size:12px;flex:1">--card-padding</span><span class="m" data-v="card-padding"></span></div></div><script>const cs=getComputedStyle(document.documentElement);document.querySelectorAll('[data-v]').forEach(e=>{e.textContent=cs.getPropertyValue('--'+e.dataset.v).trim().replace(/^var\(--(.*)\)$/,'→ $1')});document.querySelectorAll('.sw').forEach(e=>{const v=cs.getPropertyValue('--'+e.dataset.t).trim();e.style.background='var(--'+e.dataset.t+')';if(!/(#|rgb|var\(--(matcha|cream|haldi|neutral|mirchi|neel|surface|border|text))/.test(v))e.style.visibility='hidde
