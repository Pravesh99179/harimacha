<!-- @dsCard group="Website" viewport="1280x800" name="Website" subtitle="Home, shop, product and cart drawer" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Hari Matcha — Website UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/load-components.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
loadHari('../../', ['shared.jsx', 'Chrome.jsx', 'HomeScreen.jsx', 'ShopScreen.jsx', 'ProductScreen.jsx', 'CartDrawer.jsx']).then((K) => {
  const { SiteHeader, SiteFooter, HomeScreen, ShopScreen, ProductScreen, CartDrawer } = K;
  function App() {
    const saved = JSON.parse(localStorage.getItem('hari-kit-nav') || '{}');
    const [page, setPage] = React.useState(saved.page || 'home');
    const [pid, setPid] = React.useState(saved.pid || 'kit');
    const [cart, setCart] = React.useState([]);
    const [open, setOpen] = React.useState(false);
    const go = (p, id) => { setPage(p); if (id) setPid(id); if (p === 'product' && !id) setPid('kit'); window.scrollTo(0, 0); };
    React.useEffect(() => localStorage.setItem('hari-kit-nav', JSON.stringify({ page, pid })), [page, pid]);
    const add = (p, size, qty = 1, unit) => {
      const u = unit ?? parseInt(size.meta.replace(/[^\d]/g, ''), 10);
      const key = p.id + size.value + u;
      setCart((c) => c.find((i) => i.key === key) ? c.map((i) => i.key === key ? { ...i, qty: i.qty + qty } : i) : [...c, { key, id: p.id, name: p.name, size: size.label, unit: u, qty }]);
      setOpen(true);
    };
    const setQty = (k, q) => setCart((c) => q < 1 ? c.filter((i) => i.key !== k) : c.map((i) => i.key === k ? { ...i, qty: q } : i));
    const count = cart.reduce((s, i) => s + i.qty, 0);
    return (
      <div>
        <SiteHeader page={page} go={go} cartCount={count} openCart={() => setOpen(true)} />
        {page === 'home' && <HomeScreen go={go} onAdd={add} />}
        {page === 'shop' && <ShopScreen go={go} onAdd={add} />}
        {page === 'product' && <ProductScreen productId={pid} go={go} onAdd={add} />}
        <SiteFooter go={go} />
        <CartDrawer open={open} items={cart} onClose={() => setOpen(false)} setQty={setQty} remove={(k) => setQty(k, 0)} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
