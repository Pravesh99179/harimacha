<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../lib/load-components.js"></script>
<style>body{padding:24px;background:var(--surface-page)} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center} .lbl{font:500 11px/1 var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:10px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
loadHari('../../').then((DS) => {
const { Button, IconButton, Input, Select, Checkbox, Radio, Switch, Table, Badge, Card, Text, Logo, Icon } = DS;

function App(){const rows=[{id:1,grade:'Ceremonial',use:'Usucha, straight',size:'30 g',cup:'₹30',price:'₹899',tag:'accent'},{id:2,grade:'Everyday',use:'Lattes, iced',size:'50 g',cup:'₹12',price:'₹599',tag:'value'},{id:3,grade:'Culinary',use:'Baking, smoothies',size:'100 g',cup:'₹6',price:'₹549'}];
return <div style={{display:'flex',flexDirection:'column',gap:20}}>
<div className="row"><Badge tone="matcha" icon="leaf">Ceremonial</Badge><Badge tone="accent">Best value</Badge><Badge tone="haldi">Low stock</Badge><Badge tone="mirchi">Sold out</Badge><Badge tone="neel">New</Badge><Badge tone="neutral">30 g</Badge><Badge tone="brand">हरी</Badge><Badge tone="matcha" size="sm">sm</Badge></div>
<Table onRowClick={()=>{}} columns={[{key:'grade',header:'Grade',render:r=><span style={{display:'flex',gap:8,alignItems:'center',fontWeight:500}}>{r.grade}{r.tag==='value'&&<Badge tone="accent" size="sm">Best value</Badge>}</span>},{key:'use',header:'Best for'},{key:'size',header:'Pack'},{key:'cup',header:'Per cup',align:'right'},{key:'price',header:'Price',align:'right'}]} rows={rows}/>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script></body></html>
