 id="haldi-200"></div></div><div><div style="height:72px;border-radius:8px;background:var(--haldi-300);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">300</div><div class="m" id="haldi-300"></div></div><div><div style="height:72px;border-radius:8px;background:var(--haldi-500);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">500</div><div class="m" id="haldi-500"></div></div><div><div style="height:72px;border-radius:8px;background:var(--haldi-700);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">700</div><div class="m" id="haldi-700"></div></div><div><div style="height:72px;border-radius:8px;background:var(--haldi-900);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">900</div><div class="m" id="haldi-900"></div></div></div><script>document.querySelectorAll('.m[id]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.id).trim()})</script></body></html>
