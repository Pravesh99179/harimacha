round:var(--neutral-700);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">700</div><div class="m" id="neutral-700"></div></div><div><div style="height:72px;border-radius:8px;background:var(--neutral-800);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">800</div><div class="m" id="neutral-800"></div></div><div><div style="height:72px;border-radius:8px;background:var(--neutral-900);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">900</div><div class="m" id="neutral-900"></div></div><div><div style="height:72px;border-radius:8px;background:var(--neutral-950);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">950</div><div class="m" id="neutral-950"></div></div></div><script>document.querySelectorAll('.m[id]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.id).trim()})</script></body></html>
