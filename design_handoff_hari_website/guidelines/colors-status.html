<!-- @dsCard group="Colors" viewport="700x260" name="Mirchi & Neel" subtitle="Error (mirchi) and info (neel) primitives" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-secondary)}.n{font:500 13px/1.2 var(--font-sans)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px"><div><div style="height:72px;border-radius:8px;background:var(--mirchi-100);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">100</div><div class="m" id="mirchi-100"></div></div><div><div style="height:72px;border-radius:8px;background:var(--mirchi-300);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">300</div><div class="m" id="mirchi-300"></div></div><div><div style="height:72px;border-radius:8px;background:var(--mirchi-500);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">500</div><div class="m" id="mirchi-500"></div></div><div><div style="height:72px;border-radius:8px;background:var(--mirchi-700);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">700</div><div class="m" id="mirchi-700"></div></div></div><div style="height:14px"></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px"><div><div style="height:72px;border-radius:8px;background:var(--neel-100);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">100</div><div class="m" id="neel-100"></div></div><div><div style="height:72px;border-radius:8px;background:var(--neel-300);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">300</div><div class="m" id="neel-300"></div></div><div><div style="height:72px;border-radius:8px;background:var(--neel-500);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">500</div><div class="m" id="neel-500"></div></div><div><div style="height:72px;border-radius:8px;background:var(--neel-700);border:1px solid rgba(0,0,0,.05)"></div><div class="n" style="margin-top:6px">700</div><div class="m" id="neel-700"></div></div></div><script>document.querySelectorAll('.m[id]').forEach(e=>{e.textContent=getComputedStyle(document.documentElement).getPropertyValue('--'+e.id).trim()})</script></body></html>
