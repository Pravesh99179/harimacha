<!-- @dsCard group="Colors" viewport="700x370" name="Semantic · Surface & Border" subtitle="Surfaces, borders and focus" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:400 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-secondary)}.n{font:500 13px/1.2 var(--font-sans)}</style></head><body><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px"><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-page);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-page</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-raised</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-sunken);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-sunken</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-cream);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-cream</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-brand);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-brand</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-accent);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-accent</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-hover);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-hover</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-selected);border:1px solid rgba(0,0,0,.06)"></span><span><div class="n">--surface-selected</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:2px solid var(--border-subtle)"></span><span><div class="n">--border-subtle</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:2px solid var(--border-default)"></span><span><div class="n">--border-default</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:2px solid var(--border-strong)"></span><span><div class="n">--border-strong</div></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:44px;height:44px;border-radius:8px;background:var(--surface-raised);border:2px solid var(--border-focus)"></span><span><div class="n">--border-focus</div></span></div></div></body></html>
